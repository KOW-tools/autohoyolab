services:
  api:
    image: ghcr.io/kow-tools/autohoyolab:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      BIND: 0.0.0.0:8080
      DATABASE_URI: mongodb://mongo:27017
    volumes:
      - ./config.toml:/config.toml:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo-data:
